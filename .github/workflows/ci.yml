name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check formatting with Black
        run: python -m black --check src tests

      - name: Lint with Flake8
        run: python -m flake8 src tests

      - name: Run unit tests
        run: python -m pytest tests/ -v

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform/

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

  kubernetes:
    name: Kubernetes validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -kubernetes-version 1.34.0 k8s/
  
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, terraform, kubernetes]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "model.onnx" \
            --dir models/neural_network

          gh release download model-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "preprocessor.joblib" \
            --dir models/neural_network

      - name: Build backend image
        run: docker build -t credit-scoring-api:latest .

      - name: Build frontend image
        run: docker build -t credit-scoring-frontend:latest ./frontend