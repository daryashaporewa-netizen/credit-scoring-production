name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  build:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "model.onnx" \
            --dir models/neural_network

          gh release download model-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "preprocessor.joblib" \
            --dir models/neural_network

      - name: Build backend image
        run: docker build -t credit-scoring-api:ci .

      - name: Build frontend image
        run: docker build -t credit-scoring-frontend:ci ./frontend

  test:
    name: Python tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check formatting with Black
        run: python -m black --check src tests

      - name: Lint with Flake8
        run: python -m flake8 src tests

      - name: Run unit tests
        run: python -m pytest tests/ -v

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform/

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

  kubernetes:
    name: Kubernetes validation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -kubernetes-version 1.34.0 k8s/

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "model.onnx" \
            --dir models/neural_network

          gh release download model-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "preprocessor.joblib" \
            --dir models/neural_network

      - name: Build images for scanning
        run: |
          docker build -t credit-scoring-api:scan .
          docker build -t credit-scoring-frontend:scan ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: credit-scoring-api:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: credit-scoring-frontend:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: [test, terraform, kubernetes, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "model.onnx" \
            --dir models/neural_network

          gh release download model-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "preprocessor.joblib" \
            --dir models/neural_network

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable images
        run: |
          docker build -t "$API_IMAGE:$GITHUB_SHA" -t "$API_IMAGE:latest" .
          docker build \
            -t "$FRONTEND_IMAGE:$GITHUB_SHA" \
            -t "$FRONTEND_IMAGE:latest" \
            ./frontend

          docker push "$API_IMAGE:$GITHUB_SHA"
          docker push "$API_IMAGE:latest"
          docker push "$FRONTEND_IMAGE:$GITHUB_SHA"
          docker push "$FRONTEND_IMAGE:latest"

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: publish
    if: vars.ENABLE_DEPLOYMENT == 'true'
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Deploy immutable images to staging
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/credit-scoring-api \
            api="$API_IMAGE:$GITHUB_SHA"
          kubectl set image deployment/credit-scoring-frontend \
            frontend="$FRONTEND_IMAGE:$GITHUB_SHA"
          kubectl rollout status deployment/credit-scoring-api --timeout=180s
          kubectl rollout status deployment/credit-scoring-frontend --timeout=180s

  monitor-staging:
    name: Monitor staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: vars.ENABLE_DEPLOYMENT == 'true'
    environment: staging

    steps:
      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Check deployments and API health
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl wait \
            --for=condition=available \
            deployment/credit-scoring-api \
            deployment/credit-scoring-frontend \
            --timeout=180s
          kubectl run "staging-smoke-$GITHUB_RUN_ID" \
            --image=curlimages/curl:8.16.0 \
            --restart=Never \
            --attach \
            --rm \
            --command -- curl -fsS http://credit-scoring-service/

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: monitor-staging
    if: vars.ENABLE_DEPLOYMENT == 'true'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Deploy immutable images to production
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/credit-scoring-api \
            api="$API_IMAGE:$GITHUB_SHA"
          kubectl set image deployment/credit-scoring-frontend \
            frontend="$FRONTEND_IMAGE:$GITHUB_SHA"
          kubectl rollout status deployment/credit-scoring-api --timeout=180s
          kubectl rollout status deployment/credit-scoring-frontend --timeout=180s

  monitor-production:
    name: Monitor production
    runs-on: ubuntu-latest
    needs: deploy-production
    if: vars.ENABLE_DEPLOYMENT == 'true'
    environment: production

    steps:
      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Check deployments and API health
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl wait \
            --for=condition=available \
            deployment/credit-scoring-api \
            deployment/credit-scoring-frontend \
            --timeout=180s
          kubectl run "production-smoke-$GITHUB_RUN_ID" \
            --image=curlimages/curl:8.16.0 \
            --restart=Never \
            --attach \
            --rm \
            --command -- curl -fsS http://credit-scoring-service/
