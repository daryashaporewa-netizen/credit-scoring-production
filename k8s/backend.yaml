apiVersion: v1
kind: ConfigMap
metadata:
  name: credit-scoring-config
data:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"

---
apiVersion: v1
kind: Secret
metadata:
  name: credit-scoring-secret
type: Opaque
data: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-scoring-api
  labels:
    app: credit-scoring-api
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: credit-scoring-api

  template:
    metadata:
      labels:
        app: credit-scoring-api

    spec:
      containers:
        - name: api
          image: ghcr.io/daryashaporewa-netizen/credit-scoring-api:5d33cfd
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: credit-scoring-config

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: credit-scoring-service
spec:
  type: ClusterIP

  selector:
    app: credit-scoring-api

  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: credit-scoring-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"

spec:
  rules:
    - http:
        paths:
          - path: /predict
            pathType: Prefix
            backend:
              service:
                name: credit-scoring-service
                port:
                  number: 80

          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: credit-scoring-service
                port:
                  number: 80

          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: credit-scoring-service
                port:
                  number: 80

          - path: /
            pathType: Prefix
            backend:
              service:
                name: credit-scoring-frontend
                port:
                  number: 80