apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-scoring-frontend
  labels:
    app: credit-scoring-frontend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: credit-scoring-frontend

  template:
    metadata:
      labels:
        app: credit-scoring-frontend

    spec:
      containers:
        - name: frontend
          image: ghcr.io/daryashaporewa-netizen/credit-scoring-production-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: credit-scoring-frontend
spec:
  type: ClusterIP

  selector:
    app: credit-scoring-frontend

  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
